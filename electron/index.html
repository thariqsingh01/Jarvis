<!DOCTYPE html>
<html>
<head>
  <title>Jarvis Desktop</title>
  <style>
    body { font-family: Arial; background: #b3a5a5; color: white; margin: 0; }
    #log { width: 100%; height: 70%; background: #2e2e2e; overflow-y: auto; padding: 10px; }
    #controls { display: flex; gap: 10px; padding: 10px; }
    button { padding: 10px; font-size: 16px; }
    input { flex: 1; padding: 10px; font-size: 16px; }
  </style>
</head>
<body>
  <div id="log"></div>
  <div id="controls">
    <input id="commandInput" placeholder="Type your command here..." />
    <button id="sendBtn">Send</button>
    <button id="listenBtn">🎤 Listen</button>
  </div>

  <div id="jarvis-animation" style="width: 200px; height: 200px; margin: 10px auto;"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.1/lottie.min.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
